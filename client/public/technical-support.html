<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#9e0a0a">
  <meta name="robots" content="noindex, nofollow">
  <title>الدعم الفني | تيك</title>
  <link rel="icon" type="image/png" href="/__maintenance/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zain:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    :root{color-scheme:light;--brand:#9e0a0a;--paper:#f6f2ea;--ink:#382a27;--muted:#76665e;--line:#dcd2c5;--font:"Zain",Tahoma,sans-serif}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;min-height:100dvh;background:var(--paper);color:var(--ink);font-family:var(--font);display:flex;flex-direction:column}
    header{height:82px;padding:0 clamp(22px,6vw,90px);display:flex;align-items:center;border-bottom:1px solid var(--line);background:rgba(255,253,249,.52)}
    .logo{display:flex;align-items:center;gap:17px;text-decoration:none}.logo img{width:84px;height:auto}.logo span{height:34px;width:1px;background:var(--line)}.logo b{font-size:17px;color:var(--muted);font-weight:400}
    main{width:min(1080px,calc(100% - 44px));margin:auto;display:grid;grid-template-columns:minmax(0,1fr) 260px;align-items:center;gap:70px;padding:72px 0;animation:arrive .7s ease-out both}
    .copy{max-width:650px}.eyebrow{margin:0 0 14px;color:var(--brand);font-size:18px}.copy h1{font-size:clamp(48px,7vw,88px);line-height:1.03;margin:0;color:var(--ink);font-weight:700}.copy h1 span{color:var(--brand)}.copy p{font-size:23px;line-height:1.65;color:var(--muted);max-width:540px;margin:22px 0 30px}
    .home-link{display:inline-flex;align-items:center;gap:12px;background:var(--brand);color:var(--paper);padding:12px 21px;text-decoration:none;font-size:18px;border:1px solid var(--brand);transition:background .18s,transform .18s}.home-link:hover{background:#730909;transform:translateY(-2px)}.home-link:focus-visible{outline:3px solid #c98d72;outline-offset:4px}
    .mark{height:265px;display:grid;place-items:center;position:relative;color:var(--brand)}.mark:before,.mark:after{content:"";position:absolute;border:1px solid #dfc9bd;border-radius:50%;width:210px;height:210px}.mark:after{width:250px;height:250px;border-color:#eadfd3}.mark-inner{z-index:1;width:145px;height:145px;background:var(--brand);color:var(--paper);display:grid;place-items:center;clip-path:polygon(50% 0,94% 21%,94% 79%,50% 100%,6% 79%,6% 21%)}.mark-inner img{width:104px;filter:brightness(0) invert(1);opacity:.96}.small-note{font-size:16px;color:#9a887b;margin-top:35px}
    footer{border-top:1px solid var(--line);padding:17px clamp(22px,6vw,90px);display:flex;justify-content:space-between;gap:15px;color:var(--muted);font-size:16px}footer a{color:var(--brand);text-decoration:none}
    @keyframes arrive{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    @media(max-width:700px){header{height:70px;padding-inline:20px}.logo img{width:68px}.logo{gap:12px}.logo b{font-size:15px}main{grid-template-columns:1fr;gap:20px;width:calc(100% - 40px);padding:44px 0}.copy h1{font-size:clamp(48px,13vw,70px)}.copy p{font-size:20px}.mark{grid-row:1;height:165px}.mark:before{width:145px;height:145px}.mark:after{width:175px;height:175px}.mark-inner{width:104px;height:104px}.mark-inner img{width:76px}.small-note{margin-top:22px}footer{padding:14px 20px;font-size:14px}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
    .logo img{filter:brightness(0) saturate(100%) invert(11%) sepia(94%) saturate(3915%) hue-rotate(353deg) brightness(81%) contrast(111%)}
  </style>
</head>
<body>
  <header>
    <a class="logo" href="/" aria-label="العودة إلى تيك"><img src="/__maintenance/logo.png" alt="تيك — TEAK" width="782" height="511"><span aria-hidden="true"></span><b>بوابة تيك</b></a>
  </header>
  <main>
    <section class="copy" aria-labelledby="support-title">
      <p class="eyebrow">خدمات الموظفين · تيك</p>
      <h1 id="support-title">الدعم الفني<br><span>قريبًا.</span></h1>
      <p>نعمل على تجهيز مساحة مخصصة لمساعدتك. ستجد هنا قريبًا دعمًا أوضح وأسهل، يليق بتجربتك في تيك.</p>
      <a class="home-link" href="/employee-self-service">العودة إلى الخدمة الذاتية <span aria-hidden="true">←</span></a>
      <p class="small-note">للمساعدة العاجلة، يرجى استخدام قنوات التواصل الداخلية المعتمدة.</p>
    </section>
    <div class="mark" aria-hidden="true"><div class="mark-inner"><img src="/__maintenance/logo.png" alt=""></div></div>
  </main>
  <footer><span>تيك · لكل بيت، تفاصيله.</span><a href="/">العودة إلى الرئيسية</a></footer>
</body>
</html>
