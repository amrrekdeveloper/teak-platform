<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#9e0a0a">
  <meta name="robots" content="noindex, nofollow">
  <title>الدعم الفني | تيك</title>
  <link rel="icon" type="image/png" href="/__maintenance/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zain:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    :root{color-scheme:light;--brand:#9e0a0a;--paper:#f7f5f1;--ink:#252321;--muted:#706d68;--line:#e5e1dc;--font:"Zain",Tahoma,sans-serif}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;min-height:100dvh;background:var(--paper);color:var(--ink);font-family:var(--font);display:flex;flex-direction:column}
    header{height:62px;flex:none;padding:0 clamp(16px,4vw,48px);display:flex;align-items:center;border-bottom:1px solid var(--line);background:#fff}
    .logo{display:flex;align-items:center;gap:12px;text-decoration:none}.logo img{width:60px;height:auto}.logo span{height:27px;width:1px;background:var(--line)}.logo b{font-size:14px;color:var(--muted);font-weight:400}
    main{width:min(760px,calc(100% - 32px));margin:auto;display:block;padding:clamp(28px,8vh,72px) 0;animation:arrive .25s ease-out both}
    .copy{max-width:600px;margin:auto;border:1px solid var(--line);background:#fff;padding:clamp(20px,4vw,32px)}.eyebrow{margin:0 0 5px;color:var(--brand);font-size:13px}.copy h1{font-size:23px;line-height:1.25;margin:0;color:var(--ink);font-weight:700}.copy h1 span{color:var(--brand)}.copy p{font-size:15px;line-height:1.5;color:var(--muted);margin:10px 0 16px}
    .home-link{display:inline-flex;align-items:center;gap:8px;background:var(--brand);color:#fff;padding:8px 13px;text-decoration:none;font-size:14px;border:1px solid var(--brand);transition:background .18s}.home-link:hover{background:#760909}.home-link:focus-visible{outline:2px solid var(--brand);outline-offset:3px}
    .mark{display:none}.small-note{font-size:13px!important;color:var(--muted)!important;margin-top:14px!important}
    footer{border-top:1px solid var(--line);padding:12px clamp(16px,4vw,48px);display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-size:12px;background:#fff}footer a{color:var(--brand);text-decoration:none}
    @keyframes arrive{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
    @media(max-width:700px){header{height:54px;padding-inline:14px}.logo img{width:52px}.logo{gap:9px}.logo b{font-size:13px}main{width:calc(100% - 24px);padding:20px 0}.copy h1{font-size:21px}.copy p{font-size:14px}footer{padding:10px 12px;font-size:12px}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
    .logo img{filter:brightness(0) saturate(100%) invert(11%) sepia(94%) saturate(3915%) hue-rotate(353deg) brightness(81%) contrast(111%)}
  </style>
</head>
<body>
  <header>
    <a class="logo" href="/" aria-label="العودة إلى تيك"><img src="/__maintenance/logo.png" alt="تيك — TEAK" width="782" height="511"><span aria-hidden="true"></span><b>بوابة تيك</b></a>
  </header>
  <main>
    <section class="copy" aria-labelledby="support-title">
      <p class="eyebrow">بوابة الموظفين</p>
      <h1 id="support-title">الدعم الفني · <span>قريبًا</span></h1>
      <p>خدمة الدعم عبر البوابة قيد التجهيز.</p>
      <a class="home-link" href="/employee-self-service">خدمات الموظفين</a>
      <p class="small-note">للمساعدة العاجلة، استخدم قنوات التواصل الداخلية.</p>
    </section>
    <div class="mark" aria-hidden="true"><div class="mark-inner"><img src="/__maintenance/logo.png" alt=""></div></div>
  </main>
  <footer><span>تيك · بوابة الموظفين</span><a href="/">الرئيسية</a></footer>
</body>
</html>
